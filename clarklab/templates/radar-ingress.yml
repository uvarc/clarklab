apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.org/proxy-send-timeout: "3600"
    nginx.org/proxy-read-timeout: "3600"
    proxy-send-timeout: "3600"
    proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "1000M"
    nginx.ingress.kubernetes.io/client-max-body-size: "1000M"
    nginx.org/client-max-body-size: "1000M"
    client-max-body-size: "1000M"
    nginx.org/proxy-buffering: "false"
  name: radar-ingress
  namespace: {{ .Values.namespace }}
spec:
  rules:
    - host: {{ .Values.radar.host | quote }}
      http:
        paths:
        - pathType: Prefix
          path: "/api"
          backend:
            service:
              name: "prod-{{ .Values.radar.backend.serviceName }}"
              port:
                number: {{ .Values.radar.backend.servicePort }}
        - pathType: Prefix
          path: "/"
          backend:
            service:
              name: {{ .Values.radar.frontend.serviceName }}
              port:
                number: {{ .Values.radar.frontend.servicePort }}
  tls:
    - hosts:
      - {{ .Values.radar.host | quote }}
      secretName: star-fairscape-tls
