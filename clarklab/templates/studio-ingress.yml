{{- if .Values.studio.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    kubernetes.io/ingress.class: nginx
    # run logs stream as server-sent events: no buffering, long reads
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  name: studio-ingress
  namespace: {{ .Values.namespace }}
spec:
  rules:
    - host: {{ .Values.studio.host | quote }}
      http:
        paths:
        - pathType: Prefix
          path: "/"
          backend:
            service:
              name: {{ .Values.studio.serviceName }}
              port:
                number: {{ .Values.studio.servicePort }}
  tls:
    - hosts:
      - {{ .Values.studio.host | quote }}
      secretName: star-fairscape-tls
{{- end }}
