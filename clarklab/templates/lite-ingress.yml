{{- if .Values.lite.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    kubernetes.io/ingress.class: nginx
    # Crate zips carry their data files.
    nginx.ingress.kubernetes.io/proxy-body-size: {{ .Values.lite.maxUploadSize | quote }}
    nginx.ingress.kubernetes.io/client-max-body-size: {{ .Values.lite.maxUploadSize | quote }}
    nginx.org/client-max-body-size: {{ .Values.lite.maxUploadSize | quote }}
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
  name: lite-ingress
  namespace: {{ .Values.namespace }}
spec:
  rules:
    - host: {{ .Values.lite.host | quote }}
      http:
        paths:
        - pathType: Prefix
          path: "/"
          backend:
            service:
              name: {{ .Values.lite.serviceName }}
              port:
                number: {{ .Values.lite.servicePort }}
  tls:
    - hosts:
      - {{ .Values.lite.host | quote }}
      secretName: star-fairscape-tls
{{- end }}
