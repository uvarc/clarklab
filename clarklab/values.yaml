namespace: "clarklab"

jupyterhub:
  image: "quay.io/jupyter/datascience-notebook:notebook-7.5.7"
  serviceName: "dev-jupyterhub"
  servicePort: 8080
  serviceTargetPort: 8080
  deploymentName: "dev-jupyterhub-deployment"
  appName: "dev-jupyterhub"
  requests:
    memory: "3024Mi"
    cpu: "100m"
  limits:
    memory: "5024Mi"
    cpu: "300m"
  volume:
    pvcName: "dev-jupyterhub-pvc"
    name: "dev-jupyterhub-notebook-storage"
    storage: "50Gi"

fairscape:
  pullSecretName: "ghcr-secret"
  #mongo:
  #  serviceName: "mongodb"
  #  replicas: 1
  #  appName: "mongo-db"
  #  volume:
  #    pvcName: "mongo-prod-research-project-pvc"
  #    storageClassName: "longhorn-ll"
      #storageClassName: "clarklab-sc"
      #volumeName: "clarklab-nfs-pv"
  #    storage: "200Gi"
  #  image: "docker.io/library/mongo:8.0.21"
  #  requests:
  #    memory: "8000Mi"
  #    cpu: "2000m"
  #  limits:
  #    memory: "16000Mi"
  #    cpu: "5000m"
  minio:
    image: quay.io/minio/minio:latest
    appName: minio-app
    serviceName: incluster-minio
    servicePort: 9000
    serviceTargetPort: 9000
    prod:
      secretName: "prod-minio-secret"
      bucketName: "clarklab"
    test:
      secretName: "test-minio-secret"
      bucketName: "test"
    requests:
      memory: "4024Mi"
      cpu: "1000m"
    limits:
      memory: "8024Mi"
      cpu: "3000m"
    onNodeVolume:
      storageClassName: "longhorn-ll"
      pvcName: "minio-prod-on-node-pvc"
      storage: "500Gi"
    volume:
      storageClassName: "clarklab-sc"
      volumeName: "clarklab-nfs-pv"
      pvcName: "minio-prod-research-project-pvc"
      storage: "300Gi"

  backend:
    logfire:
      secretName: "logfire-secrets"
      prod:
        key: "prod"
        env: "prod"
      test:
        key: "test"
        env: "test" 
    image: "ghcr.io/fairscape/mds_python:RELEASE.2026-07-09.v1"
    testImage: "ghcr.io/fairscape/mds_python:RELEASE.2026-07-09.v1"
    appName: "backend-app"
    serviceName: "backend-service"
    servicePort: 8080
    serviceTargetPort: 8080
    requests:
      memory: "4024Mi"
      cpu: "2000m"
    limits:
      memory: "6024Mi"
      cpu: "4000m"
  frontend:
    image: "ghcr.io/fairscape/fairscapefrontend:RELEASE.2026-08-04.v2"
    testImage: "ghcr.io/fairscape/fairscapefrontend:RELEASE.2026-08-04.v2"
    appName: "fairscape-frontend-app"
    serviceName: "frontend-service"
    servicePort: 80
    serviceTargetPort: 80
    requests:
      memory: "2024Mi"
      cpu: "500m"
    limits:
      memory: "4024Mi"
      cpu: "700m"
  worker:
    image: "ghcr.io/fairscape/mds_python:RELEASE.2026-07-09.v1"
    testImage: "ghcr.io/fairscape/mds_python:RELEASE.2026-07-09.v1"
    appName: "fairscape-worker-app"
    requests:
      memory: "3Gi"
      cpu: "2000m"
    limits:
      memory: "4Gi"
      cpu: "4000m"
  # Set fairscape.search to render the two search deployments + populate CronJobs.
  # One deployment per env, each serving one chroma collection from its own mongo db.
  search:
    image: "ghcr.io/fairscape/semantic_search:RELEASE.2026-07-10.v1"
    servicePort: 5050
    serviceTargetPort: 5050
    test:
      collection: "fairscape_test"
    prod:
      collection: "fairscape_prod"
    requests:
      memory: "1Gi"
      cpu: "250m"
    limits:
      memory: "2Gi"
      cpu: "1000m"

redis:
  image: "public.ecr.aws/docker/library/redis:latest"
  serviceName: "prod-redis-service"
  servicePort: 6379
  prod:
    jobDB: "0"
    resultDB: "1"
  test:
    jobDB: "2"
    resultDB: "3"
  jobDatabase: "0"
  resultDatabase: "1"
  requests:
    memory: "2000Mi"
    cpu: "200m"
  limits:
    memory: "3000Mi"
    cpu: "300m"

mongo:
  hostURI: "prod-mongo-psmdb-db-rs0.clarklab.svc.cluster.local"
  #hostURI: "mongodb.clarklab.svc.cluster.local"
  serviceName: "mongodb"
  port: "27017"
  test:
    db: "test"
    username:
      secretName: "mongo-test-secret"
      secretKey: "username"
    password:
      secretName: "mongo-test-secret"
      secretKey: "password"
  prod:
    db: "clarklab"
    username:
      secretName: "mongo-prod-secret"
      secretKey: "username"
    password:
      secretName: "mongo-prod-secret"
      secretKey: "password"

minio:
  serviceName: "minio.uvarc.io"
  accessKey:
    secretName: minio-secret
    secretKey: username
  secretKey:
    secretName: minio-secret
    secretKey: password

chromadb:
  # Env-neutral: one instance holds both the fairscape_test and fairscape_prod
  # collections (was test-chromadb before it served prod too).
  image: "chromadb/chroma:1.0.12"
  appName: "chromadb"
  serviceName: "chromadb-service"
  servicePort: 8000
  containerPort: 8000
  volume:
    pvcName: "chromadb-data-pvc"
    storageClassName: "longhorn-ll"
    storage: "5Gi"
  requests:
    memory: "1Gi"
    cpu: "200m"
  limits:
    memory: "2Gi"
    cpu: "500m"

radar:
  host: "radar.fairscape.net"
  backend:
    # 2026-08-27 tag adds scispacy + the sci-lg model, the pre-warmed
    # UMLS KB, and the mxbai topic index baked into the image.
    image: "ghcr.io/fairscape/radar-backend:RELEASE.2026-08-27.v1"
    appName: "radar-backend-app"
    serviceName: "radar-backend-service"
    servicePort: 8000
    serviceTargetPort: 8000
    anthropic:
      secretName: ""
      secretKey: "api-key"
    # Demoware: state lives in an emptyDir, so everything (DB, PDFs,
    # chroma index, downloaded model weights) resets when the pod is
    # rescheduled. Deliberate — the longhorn-ll PVC stuck at
    # "not ready for workloads" and simple beats durable for now.
    scratch:
      sizeLimit: "20Gi"
    # CPU-only MedCPT reranking + SPECTER2 embedding happen in-process;
    # give it headroom or the daily gather crawls.
    requests:
      memory: "4Gi"
      cpu: "1000m"
    limits:
      memory: "8Gi"
      cpu: "4000m"
  # CPU ollama serving only the mxbai embedding model (UMLS topic
  # mapping + chat-side vault index). See templates/radar-ollama.yml.
  ollama:
    image: "ollama/ollama:latest"
    appName: "radar-ollama-app"
    serviceName: "radar-ollama-service"
    embeddingModel: "mxbai-embed-large"
    scratch:
      sizeLimit: "5Gi"
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "3Gi"
      cpu: "2000m"
  frontend:
    image: "ghcr.io/fairscape/radar-frontend:RELEASE.2026-08-25.v1"
    appName: "radar-frontend-app"
    serviceName: "radar-frontend-service"
    servicePort: 80
    serviceTargetPort: 5173
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "300m"

radarConfig:
  env:
    - name: "RADAR_DB_PATH"
      value: "/app/data/radar.db"
    - name: "RADAR_VAULT_DIR"
      value: "/app/vault"
    - name: "RADAR_CHROMA_DIR"
      value: "/app/chroma"
    - name: "RADAR_DEFAULT_MAILTO"
      value: "jcn4rh@virginia.edu"
    - name: "RADAR_CORS_ORIGINS"
      value: '["https://radar.fairscape.net"]'
    - name: "RADAR_LOG_JSON"
      value: "true"
    - name: "RADAR_SCHEDULER_ENABLED"
      value: "true"
    - name: "RADAR_REQUIRE_AUTH"
      value: "true"
    - name: "RADAR_LLM_PROVIDER"
      value: "ollama"
    # In-cluster CPU ollama (templates/radar-ollama.yml) serves ONLY the
    # mxbai embedding model — /api/chat still 503s (no LLM pulled) until
    # RADAR_OLLAMA_URL points at a host that has one.
    - name: "RADAR_OLLAMA_URL"
      value: "http://radar-ollama-service:11434"
    - name: "RADAR_CHAT_EMBEDDING_MODEL"
      value: "mxbai-embed-large"
    # UMLS extraction is CPU scispacy; the 2026-08-27+ backend image
    # bakes the model, ~1GB KB, and mxbai topic index at /app/umls_cache.
    - name: "RADAR_UMLS_ENABLED"
      value: "true"
    - name: "RADAR_UMLS_CACHE_DIR"
      value: "/app/umls_cache"
    - name: "RADAR_RERANKER_ENABLED"
      value: "true"
    - name: "RADAR_RERANKER_DEVICE"
      value: "cpu"
    - name: "RADAR_RERANKER_QUERY_MODE"
      value: "topic"
    - name: "HF_HOME"
      value: "/app/data/hf"

fairscapeConfig:
  env:
    - name: "FAIRSCAPE_HOST"
      value: "fairscape.net"
    - name: "FAIRSCAPE_PORT"
      value: "8080"
    - name: "FAIRSCAPE_LDAP_PORT"
      value: "1389"
    - name: "FAIRSCAPE_MONGO_PORT"
      value: "27017"
    - name: "FAIRSCAPE_MONGO_IDENTIFIER_COLLECTION"
      value: "fairscape"
    - name: "FAIRSCAPE_MONGO_USER_COLLECTION"
      value: "users"
    - name: "FAIRSCAPE_MONGO_TOKENS_COLLECTION"
      value: "tokens"
    - name: "FAIRSCAPE_MONGO_ASYNC_COLLECTION"
      value: "async"
    - name: "FAIRSCAPE_MONGO_ROCRATE_COLLECTION"
      value: "rocrate"
    - name: "FAIRSCAPE_MINIO_URI"
      value: http://incluster-minio:9000
    - name: "FAIRSCAPE_MINIO_SECURE"
      value: "True"
    - name: "FAIRSCAPE_MINIO_CERT_CHECK"
      value: "False"
    - name: "FAIRSCAPE_MINIO_DEFAULT_BUCKET_PATH"
      value: "default"
    - name: "FAIRSCAPE_MINIO_ROCRATE_BUCKET_PATH"
      value: "rocrate"
    - name: "FAIRSCAPE_NAAN"
      value: "59852"
    - name: "FAIRSCAPE_URL"
      value: "https://fairscape.net"
